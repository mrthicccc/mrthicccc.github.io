<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Touring App has moved</title>
<link rel="canonical" href="https://github.com/mrthicccc/Touring">
<meta http-equiv="refresh" content="0; url=https://github.com/mrthicccc/Touring">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: #0b0b0f; color: #f4f4f6;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 420px; width: 100%; text-align: center; }
  .mark {
    width: 54px; height: 54px; margin: 0 auto 22px; border-radius: 14px;
    background: #16161d; border: 1px solid #2a2a36; display: grid; place-items: center;
  }
  .mark span { width: 20px; height: 20px; border: 2.5px solid #fbbf24; border-radius: 50%; display: block; position: relative; }
  .mark span::after { content: ''; position: absolute; inset: 5px; background: #fbbf24; border-radius: 50%; }
  h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: -0.02em; }
  p { color: #9a9aa8; margin: 0 0 24px; }
  a.btn {
    display: block; padding: 14px; border-radius: 12px; text-decoration: none;
    font-weight: 700; margin-bottom: 10px;
  }
  a.primary { background: #fbbf24; color: #1a1400; }
  a.secondary { background: #1f1f28; color: #f4f4f6; border: 1px solid #2a2a36; }
  small { display: block; margin-top: 18px; color: #6b6b7a; font-size: 12.5px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span></span></div>
    <h1>Touring App has moved</h1>
    <p>This project now lives in its own repository. Taking you there now.</p>
    <a class="btn primary" href="https://github.com/mrthicccc/Touring">View the code on GitHub</a>
    <a class="btn secondary" href="https://touring-app.netlify.app">Open the live app</a>
    <small>If you aren't redirected, use one of the links above.</small>
  </div>
  <script>location.replace('https://github.com/mrthicccc/Touring');</script>
</body>
</html>
