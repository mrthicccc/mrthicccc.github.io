<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Finder</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #fff; --ink: #1b1a17; --muted: #6f6b63;
    --line: #e3e0d9; --accent: #c2410c; --bad: #b91c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --panel: #201f24; --ink: #ece9e3; --muted: #9a948c;
      --line: #322f38; --accent: #fb923c; --bad: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink); padding: 24px;
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .box {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 30px;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: -.01em; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px; font-family: inherit;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; margin-top: 14px; padding: 12px; font-size: 15px; font-weight: 600;
    font-family: inherit; color: #fff; background: var(--accent);
    border: 0; border-radius: 9px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .msg {
    margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px;
    color: var(--bad); border: 1px solid currentColor;
  }
  .msg:empty { display: none; }
  .foot { margin: 18px 0 0; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="box">
    <h1>Clip Finder</h1>
    <p class="sub">Enter the shared passphrase to continue.</p>
    <div class="msg"><!--MSG--></div>
    <form method="POST" action="/login">
      <label for="p">Passphrase</label>
      <input type="password" id="p" name="passphrase" autocomplete="current-password"
             autofocus required>
      <button type="submit">Sign in</button>
    </form>
    <p class="foot">You'll stay signed in on this device for 30 days.
      You'll still need your own API key to run a search.</p>
  </div>
</body>
</html>
